name: Stack CI runner test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  stack:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Checkout identity and secret boundary
        shell: bash
        run: |
          git rev-parse HEAD
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          echo 'No token variables passed to fixture commands; workflow references no secrets.'
      - uses: ./.github/actions/stack
        id: stack
        with:
          rig-version: source-626eb049905de262a29a9b027a2538b1f024e8d6
          manifest: runner-fixture/rig.stack.jsonc
          member: app
          build: dotnet build runner-fixture/dotnet/Runner.Tests.csproj
          test: dotnet test runner-fixture/dotnet/Runner.Tests.csproj --no-build --logger 'console;verbosity=normal' && cd runner-fixture/go && GOPROXY=off GOSUMDB=off go test -v ./...
      - name: Action outputs
        if: always()
        shell: bash
        env:
          COMMITS: ${{ steps.stack.outputs.commits }}
          TEST_RESULT: ${{ steps.stack.outputs.test-result }}
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          printf 'commits=%s\ntest-result=%s\nexpected=%s\n' "$COMMITS" "$TEST_RESULT" "$EXPECTED"
          test -n "$COMMITS"
          echo "$COMMITS" | python -c 'import json,os,sys; assert json.load(sys.stdin)["app"] == os.environ["EXPECTED"]'
